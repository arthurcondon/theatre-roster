<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#A6192E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roster">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Theatre Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#2b2d2a;--mute:#6b6e68;--line:#e6e2d9;--pri:#A6192E;--pri2:#80225F;--priBg:#f8e8eb;--am:#d98e04;--amBg:#fdf0d2;--amInk:#8a5200;--pm:#80225F;--pmBg:#f3e6ee;--pmInk:#6F1D46;--ok:#1b7f5c;--okBg:#dcf2e8;--bad:#C4320A;--badBg:#fdeadf;--warn:#b45309;--warnBg:#fdf0d9;--sky:#2f6f8f;--skyBg:#e2eef4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:760px;margin:0 auto;padding:0 14px 110px}
.hero{background:linear-gradient(135deg,#A6192E 0%,#6F1D46 100%);color:#fff;margin:0 -14px 16px;padding:calc(18px + env(safe-area-inset-top)) 18px 16px;border-radius:0 0 28px 28px;box-shadow:0 10px 26px rgba(111,29,70,.28)}
.hero .ey{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.fn{display:flex;align-items:center;gap:8px;margin-top:14px;background:rgba(255,255,255,.18);border-radius:16px;padding:6px}
.fn button{border:0;background:rgba(255,255,255,.26);color:#fff;width:36px;height:36px;border-radius:11px;font-size:18px;cursor:pointer}
.fn .mid{flex:1;text-align:center;font-weight:600;font-size:14px;line-height:1.25}.fn .mid small{display:block;font-weight:400;opacity:.9;font-size:12px}
.bell{position:relative;border:0;background:rgba(255,255,255,.22);color:#fff;width:42px;height:42px;border-radius:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.bell i{position:absolute;top:-5px;right:-5px;background:#ff4d6d;color:#fff;border-radius:999px;font-style:normal;font-size:11px;font-weight:700;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}
.nav button{flex:1;max-width:120px;border:0;background:none;color:var(--mute);font:600 11px Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:12px;cursor:pointer;position:relative}
.nav button.on{color:var(--pri);background:var(--priBg)}
.nav b{position:absolute;top:2px;right:20%;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center}
h2{font-size:17px;margin:22px 2px 10px;font-weight:700}h3{font-size:15px;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 2px 12px rgba(28,39,64,.06)}
.row{display:flex;gap:8px;align-items:center}.wrap{flex-wrap:wrap}.sp{flex:1}
button,select,input,textarea{font:inherit;color:var(--ink)}
input,select,textarea{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;max-width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
input[type=number]{width:72px}input[type=checkbox]{width:18px;height:18px;vertical-align:-3px;accent-color:var(--pri)}
textarea{width:100%;min-height:64px}
.btn{border:0;background:var(--priBg);color:var(--pri);padding:9px 14px;border-radius:12px;font-weight:600;cursor:pointer}
.btn.pri{background:linear-gradient(135deg,#A6192E,#7c5cff);color:#fff;box-shadow:0 4px 12px rgba(79,107,255,.3)}
.btn.ghost{background:#f1f3f9;color:var(--ink)}.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}.btn:disabled{opacity:.5}
.seg{display:inline-flex;background:#ece8df;border-radius:13px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mute);cursor:pointer}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 5px rgba(28,39,64,.12)}
.seg button.on.am{color:var(--amInk)}.seg button.on.pm{color:var(--pmInk)}
.seg5{display:flex;width:100%;margin-top:8px}.seg5 button{flex:1;padding:9px 1px;font-size:12px}
.seg5 button.on.bA{background:var(--ok);color:#fff}.seg5 button.on.bM{background:var(--am);color:#fff}.seg5 button.on.bP{background:var(--pm);color:#fff}.seg5 button.on.bL{background:var(--sky);color:#fff}.seg5 button.on.bX{background:var(--bad);color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;margin:2px 4px 2px 0}
.chip.ok{background:var(--okBg);color:var(--ok)}.chip.warn{background:var(--warnBg);color:var(--warn)}.chip.info{background:var(--priBg);color:var(--pri)}.chip.red{background:var(--badBg);color:var(--bad)}.chip.ot{background:var(--pmBg);color:var(--pmInk)}.chip.gap{border:1.5px dashed var(--warn);color:var(--warn);background:#fff}
.chip.am{background:var(--amBg);color:var(--amInk)}.chip.pm{background:var(--pmBg);color:var(--pmInk)}.chip.bad{background:var(--badBg);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.chip button{border:0;background:none;color:inherit;cursor:pointer;padding:0 0 0 2px;font-size:14px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#ece8df;color:var(--mute);margin-left:6px}.tag.ot{background:var(--pmBg);color:var(--pmInk)}.tag.red{background:var(--badBg);color:var(--bad)}.tag.mgr{background:var(--priBg);color:var(--pri)}
.banner{background:var(--warnBg);color:#8a4b06;padding:11px 14px;border-radius:14px;margin:12px 0;font-weight:500}
.banner.pri{background:var(--priBg);color:var(--pri)}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}
.ch{text-align:center;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.cd{position:relative;border:2px solid transparent;background:#fff;border-radius:16px;padding:8px 3px 7px;min-height:84px;display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(28,39,64,.06)}
.cd .dn{font-weight:700;font-size:15px}.cd .dn small{font-weight:500;color:var(--mute);font-size:10px;margin-left:2px}
.cd.sel{border-color:var(--pri)}.cd.today .dn{color:var(--pri)}.cd.short{background:#fff7f7}
.pl{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;display:block}.pl.am{background:var(--amBg);color:var(--amInk)}.pl.pm{background:var(--pmBg);color:var(--pmInk)}.pl.low{background:var(--badBg);color:var(--bad)}
.cd .me{font-size:11px;font-weight:700;color:#fff;background:var(--pri);border-radius:8px;padding:1px 6px}
.cd .rd{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.half{border-radius:14px;padding:10px 12px;margin-top:10px}.half.am{background:var(--amBg)}.half.pm{background:var(--pmBg)}
.half .hh{display:flex;font-weight:700;margin-bottom:4px}.half.am .hh{color:var(--amInk)}.half.pm .hh{color:var(--pmInk)}.half .hh span{margin-left:auto;font-weight:600;font-size:13px}
.pr{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(255,255,255,.7)}.pr:first-of-type{border-top:0}
.pr .tm{width:46px;font-weight:700;font-size:13px;color:var(--mute)}.pr .nm{font-weight:600}.pr.mine .nm{color:var(--pri)}.pr.gap .nm{color:var(--warn);font-weight:600}.pr .nm s{opacity:.55}
.rs{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.rs .tm{width:62px;flex:none;font-weight:700;font-size:13px;padding:3px 8px;border-radius:9px;text-align:center}.rs .tm.am{background:var(--amBg);color:var(--amInk)}.rs .tm.pm{background:var(--pmBg);color:var(--pmInk)}.rs .tm small{display:block;font-weight:500;font-size:10.5px;opacity:.8}
.plus{flex:none;border:0;width:32px;height:32px;border-radius:50%;background:var(--priBg);color:var(--pri);font-size:20px;font-weight:600;cursor:pointer;line-height:1}
.grid{overflow-x:auto}table{border-collapse:collapse;font-size:13px;width:100%}
th,td{padding:7px 7px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1}
td.A,td.g6,td.g7{background:var(--okBg);color:var(--ok);font-weight:700}td.g6,td.g7{background:var(--amBg);color:var(--amInk)}td.g10,td.g12,td.g13,td.g14{background:var(--pmBg);color:var(--pmInk);font-weight:700}
td.O{background:var(--pmBg);color:var(--pmInk);font-weight:700}td.L{background:var(--skyBg);color:var(--sky);font-weight:700}td.X,td.U{color:#b3bbd0}
tr.me td:first-child{color:var(--pri);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--mute);margin:6px 2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#373A36;color:#fff;padding:11px 16px;border-radius:14px;font-size:14px;z-index:30;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.wk{font-weight:700;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 0}
.empty{text-align:center;color:var(--mute);padding:26px 8px}
.ad{padding:10px 0;border-top:1px solid var(--line)}
.cand{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.cand .rk{width:28px;height:28px;flex:none;border-radius:50%;background:var(--priBg);color:var(--pri);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.chart{width:100%;height:auto;display:block}.chart text{font:10px Inter,system-ui,sans-serif;fill:var(--mute)}
details>summary{cursor:pointer;font-weight:600;color:var(--pri);padding:4px 0}
.sel{max-width:170px}
.months{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.months button{flex:none;border:0;background:#ece8df;border-radius:999px;padding:7px 14px;font-weight:600;color:var(--mute);cursor:pointer}.months button.on{background:var(--pri);color:#fff}
.sheet{overflow-x:auto;padding:0}.sheet table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
.sheet th,.sheet td{padding:7px 4px;text-align:center;border-bottom:1px solid #eef0f7;min-width:34px}
.sheet th{background:#f3f0ea;color:var(--mute);font-size:11px;font-weight:600;position:sticky;top:0}
.sheet td.nm,.sheet th.nm{text-align:left;position:sticky;left:0;background:#fff;min-width:112px;padding-left:12px;font-weight:600;z-index:1;white-space:nowrap;border-right:1px solid #eef0f7}
.sheet th.nm{background:#f3f0ea}.sheet .wkb{border-left:3px solid #fff}
.sheet td.sc{font-weight:700;cursor:pointer;border-radius:0}.sheet td.sc.am{background:var(--amBg);color:var(--amInk)}.sheet td.sc.pm{background:var(--pmBg);color:var(--pmInk)}
.sheet td.fr{color:#c9c4b8}.sheet td.na{background:repeating-linear-gradient(45deg,#fafbfe,#fafbfe 4px,#f1f3fa 4px,#f1f3fa 8px)}
.sheet tr.grp td{background:#f3f0ea;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:left;padding:5px 12px}
.sheet tr.tot td{font-weight:700;font-size:12px}.sheet tr.tot td.lo{color:var(--bad)}
.mnav{display:flex;align-items:center;gap:8px;margin:4px 0 8px}.mnav h2{margin:0;flex:1;font-size:20px}
.mnav button{border:0;background:#fff;border-radius:12px;min-width:38px;height:38px;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(28,39,64,.08);color:var(--ink)}.mnav button.tdy{font-size:13px;font-weight:600;padding:0 12px;color:var(--pri)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;border-radius:18px;padding:8px 4px;box-shadow:0 2px 10px rgba(28,39,64,.07);touch-action:pan-y}
.mg .wd{text-align:center;font-size:11px;font-weight:700;color:var(--mute);padding:4px 0}
.mc{position:relative;min-height:64px;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 1px;cursor:pointer;font:inherit;color:var(--ink)}
.mc .n{width:28px;height:28px;line-height:28px;border-radius:50%;font-weight:600;font-size:15px;text-align:center}
.mc.out .n{color:#c9c4b8}.mc.we .n{color:var(--mute)}.mc.today .n{background:var(--pri);color:#fff}.mc.sel{background:var(--priBg)}
.mc .sh{font-size:10px;font-weight:700;border-radius:7px;padding:1px 4px;white-space:nowrap}.mc .sh.am{background:var(--amBg);color:var(--amInk)}.mc .sh.pm{background:var(--pmBg);color:var(--pmInk)}
.mc .dots{display:flex;gap:3px}.mc .dots i{width:6px;height:6px;border-radius:50%;display:block}.mc .rd{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.sheet td.sc.bad{box-shadow:inset 0 0 0 2px var(--bad)}.sheet td.edited{outline:2px dashed var(--pri);outline-offset:-3px}.sheet tr.me td.nm{color:var(--pri)}
.sheet tr.cs input{width:38px;padding:4px 2px;text-align:center;font-size:13px}
.savebar{position:sticky;bottom:84px;z-index:5;background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 6px 24px rgba(28,39,64,.2);margin:10px 0}
.hero .logo{height:40px;max-width:130px;object-fit:contain;background:#fff;border-radius:10px;padding:5px 8px;margin-right:10px}.brand{display:flex;gap:12px;align-items:center}.brand .logo{height:42px;max-width:150px;object-fit:contain;background:#fff;border-radius:10px;padding:6px 9px}
.foot{font-size:11px;color:var(--mute);text-align:center;margin:22px 10px 0;line-height:1.5}
.seg button.asm{background:rgba(166,25,46,.08);box-shadow:inset 0 0 0 1.5px rgba(166,25,46,.35)}
td.asm{opacity:.6}
.sheet tr.off td{opacity:.45}.sheet tr.off td.nm::after{content:' (inactive)';font-weight:500;font-size:11px}
.two{display:grid;gap:0 12px;grid-template-columns:1fr}@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}
.hc .hl{font-weight:700;font-size:19px}.hc.due{border:2px solid var(--pri)}
.x{border:0;background:#f3f0ea;color:var(--mute);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;margin-left:6px}
.sheet .gapc{width:12px;min-width:12px;padding:0;border:0;background:linear-gradient(90deg,#fff 0 42%,#2b2d2a 42% 58%,#fff 58%)}.sheet td.sc.otb{box-shadow:inset 0 0 0 3px #1f7a4d}
.pager{margin:4px 0 8px}.pager .row{gap:8px}.pgm{flex:1;text-align:center;font-size:16px}
.pg{border:0;background:#fff;box-shadow:0 2px 10px rgba(28,39,64,.08);width:42px;height:42px;border-radius:13px;font-size:22px;color:var(--pri);cursor:pointer}
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;min-width:46px;border:0;background:#fff;border-radius:13px;padding:6px 4px;font:700 16px Inter,system-ui,sans-serif;color:var(--ink);box-shadow:0 1px 6px rgba(28,39,64,.07);cursor:pointer}
.strip button small{display:block;font-size:10px;font-weight:600;color:var(--mute);text-transform:uppercase}
.strip button.td{box-shadow:inset 0 0 0 2px var(--pri2)}.strip button.on{background:var(--pri);color:#fff}.strip button.on small{color:#fff;opacity:.85}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.cbx{background:#f3f0ea;border-radius:12px;padding:8px 4px;text-align:center}.cbx b{display:block;font-size:20px}.cbx span{font-size:11px;color:var(--mute);font-weight:600}
@media(max-width:420px){.cgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){#app{max-width:none;padding:0 36px 110px}.hero{margin:0 -36px 18px;padding-left:36px;padding-right:36px}.fn{max-width:560px}.nav button{max-width:220px}.sheet th,.sheet td{min-width:56px;font-size:14px}.sheet td.nm,.sheet th.nm{min-width:180px}.pager{max-width:900px}}
</style>
</head>
<body>
<div id="app"><div style="text-align:center;padding:40px;color:#6f7a93">Loading…</div></div>
<script src="config.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
</body>
</html>
